<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#13201b" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#eef6f0" media="(prefers-color-scheme: light)">
  <meta name="description" content="Voxxy turns text into speech in a voice you choose. Part of HeyMa.">
  <title>Voxxy</title>
  <link rel="icon" type="image/svg+xml" href="/ui/voxxy-mark.svg">
  <link rel="stylesheet" href="/ui/app.css">
  <script type="module" src="/ui/app.js"></script>
</head>
<body data-state="booting">
  <a class="skip" href="#main">Skip to content</a>

  <header class="bar">
    <div class="bar__inner">
      <a class="brand" href="#/say" aria-label="Voxxy, say something">
        <svg class="mark" viewBox="0 0 64 64" width="30" height="30" aria-hidden="true" focusable="false">
          <rect class="mark__tile" width="64" height="64" rx="14"/>
          <path class="mark__v" d="M13 14 L32 50 L51 14"/>
          <path class="mark__arc" d="M28.38 36.48 A14 14 0 0 1 35.62 36.48"/>
          <path class="mark__arc" d="M25.79 26.82 A24 24 0 0 1 38.21 26.82"/>
          <path class="mark__arc" d="M23.20 17.16 A34 34 0 0 1 40.80 17.16"/>
        </svg>
        <span class="brand__name">Voxxy</span>
      </a>

      <nav class="tabs" id="tabs" aria-label="Sections">
        <a href="#/say" data-route="say"><span>Say</span></a>
        <a href="#/voices" data-route="voices"><span>Library</span></a>
        <a href="#/make" data-route="make"><span>Make a voice</span></a>
        <a href="#/speakers" data-route="speakers"><span>Speakers</span></a>
      </nav>

      <div class="bar__end">
        <p class="health" id="health" data-level="unknown" role="status">
          <span class="health__dot" aria-hidden="true"></span>
          <span class="health__text">Checking</span>
        </p>
        <button class="btn btn--quiet" id="key-button" type="button" popovertarget="key-pop" aria-label="API key">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="8" cy="12" r="4"/><path d="M12 12h9M18 12v4M21 12v3"/></svg>
          <span class="btn__label">Key</span>
        </button>
      </div>
    </div>

    <div class="pop" id="key-pop" popover>
      <form id="key-form" class="stack" autocomplete="off">
        <h2 class="pop__title">API key</h2>
        <p class="muted" id="key-status">No key is saved in this browser.</p>
        <div class="field">
          <label for="key-input">Paste a key</label>
          <input id="key-input" name="key" type="password" autofocus autocomplete="off" autocapitalize="off" spellcheck="false">
        </div>
        <p class="notice notice--error" id="key-error" role="alert" hidden></p>
        <div class="row">
          <button class="btn btn--primary" type="submit">Save key</button>
          <button class="btn" id="key-forget" type="button">Forget key</button>
        </div>
        <p class="muted small" id="key-edition"></p>
      </form>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <noscript><p class="notice">Voxxy needs JavaScript. Turn it on for this site and reload.</p></noscript>
  </main>

  <footer class="foot">
    <p>
      <svg class="mark mark--small" viewBox="0 0 64 64" width="18" height="18" aria-hidden="true" focusable="false">
        <rect class="mark__tile" width="64" height="64" rx="14"/>
        <path class="mark__v" d="M13 14 L32 50 L51 14"/>
        <path class="mark__arc" d="M28.38 36.48 A14 14 0 0 1 35.62 36.48"/>
        <path class="mark__arc" d="M25.79 26.82 A24 24 0 0 1 38.21 26.82"/>
        <path class="mark__arc" d="M23.20 17.16 A34 34 0 0 1 40.80 17.16"/>
      </svg>
      Voxxy · part of HeyMa
    </p>
  </footer>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
