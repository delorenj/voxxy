[project]
name = "vox-service"
version = "0.1.0"
description = "Universal TTS service wrapping VoxCPM2"
requires-python = ">=3.12, <3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "fastmcp>=0.4",
    "asyncpg>=0.30",
    "pydantic>=2",
    "python-multipart",
    "soundfile",
    "httpx>=0.27",
    "faster-whisper>=1.2.1",
    "sherpa-onnx>=2.0.3",
    "numpy>=2.4.4",
]

[tool.uv]
index-url = "https://pypi.org/simple"

[dependency-groups]
dev = [
    "anyio>=4.13.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "slow: runs the real consent models (TitaNet-large, faster-whisper base.en); skipped when the model files are not on this host",
]
