services:
  # voxxy-core — CPU-only transport + routing. Synthesis runs in sidecar engine
  # containers (see compose.engines.yml). Service name stays `vox` so existing
  # monitoring, `docker logs -f vox`, and `mise run logs` keep working.
  vox:
    build: .
    container_name: vox
    restart: unless-stopped
    # Host postgres is reachable via host.docker.internal (same trick pgadmin uses).
    environment:
      VOX_DATABASE_URL: postgresql://${DEFAULT_USERNAME}:${DEFAULT_PASSWORD}@host.docker.internal:5432/vox
      VOX_VOICES_DIR: /data/voices
      VOX_AUDIO_CACHE_DIR: /data/audio-cache
      VOX_AUDIO_TTL_SECONDS: "3600"
      VOX_PUBLIC_BASE_URL: https://vox.delo.sh
      VOX_REF_AUDIO_MAX_SECONDS: "30"
      VOX_API_KEY: ${VOX_API_KEY:-}
      VOX_DEFAULT_VOICE: ${VOX_DEFAULT_VOICE:-rick}
      # Which edition the web app and voice-making routes serve. "hosted"
      # (default) makes only own-voice and described voices and refuses
      # descriptions of real people. "self" also allows uploading a clip.
      # Unknown values fall back to hosted.
      VOX_EDITION: ${VOX_EDITION:-hosted}
      # G5 consent gate. Models (faster-whisper base.en, TitaNet-large 101 MB) download on
      # first use into VOX_MODELS_DIR and are checked against a pinned sha256.
      VOX_MODELS_DIR: /data/models
      # Operator-only key for GET/POST /consent/reviews. Unset = those routes answer 503.
      # Must differ from VOX_API_KEY (the app refuses to start otherwise).
      VOX_OPERATOR_KEY: ${VOX_OPERATOR_KEY:-}
      # Bars from the G5 calibration spike (TitaNet-large raw cosine, silence cut out first):
      # accept >= 0.70, refuse < 0.10, review in between; sentence score 0.80 / 0.50; at
      # least 6 s of speech in the consent clip and 8 s in a longer sample. Recalibrate after
      # about 50 reviewed real consent pairs.
      VOX_CONSENT_ACCEPT: ${VOX_CONSENT_ACCEPT:-0.70}
      VOX_CONSENT_REJECT: ${VOX_CONSENT_REJECT:-0.10}
      VOX_CONSENT_PHRASE_OK: ${VOX_CONSENT_PHRASE_OK:-0.80}
      VOX_CONSENT_PHRASE_REVIEW: ${VOX_CONSENT_PHRASE_REVIEW:-0.50}
      VOX_CONSENT_MIN_SPEECH: ${VOX_CONSENT_MIN_SPEECH:-6}
      VOX_CONSENT_MIN_REFERENCE_SPEECH: ${VOX_CONSENT_MIN_REFERENCE_SPEECH:-8}
      VOX_CONSENT_REVIEW_FIRST: ${VOX_CONSENT_REVIEW_FIRST:-1}
      VOX_CONSENT_PRELOAD: ${VOX_CONSENT_PRELOAD:-1}
      VOX_TERMS_VERSION: ${VOX_TERMS_VERSION:-draft-1}
      # The 33GOD Bloodbank bus (NATS): a voice held for review becomes an operator push. Empty = off.
      VOX_BLOODBANK_NATS_URL: ${VOX_BLOODBANK_NATS_URL:-}
      # Default destination for the speak_sink MCP tool, so a fleet agent can
      # reach whoever is listening without knowing the sink name. Empty means
      # callers must pass one explicitly.
      VOX_DEFAULT_SINK: ${VOX_DEFAULT_SINK:-}
      # Engine registry: ordered list of name=url pairs. Core tries them in
      # order; first success wins. ElevenLabs is always appended in-process
      # and self-disables without ELEVENLABS_API_KEY. Default stack uses
      # vibevoice; local engines are mutually exclusive to conserve GPU VRAM.
      VOX_ENGINES: ${VOX_ENGINES:-vibevoice=http://voxxy-engine-vibevoice:8000}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_DEFAULT_VOICE: ${ELEVENLABS_DEFAULT_VOICE:-pNInz6obpgDQGcFmaJgB}
    volumes:
      # Voice profile WAVs (seeded + user-uploaded). Bind-mounted so you can
      # scp/rsync new voices in without the API. Core reads them to ship
      # reference audio inline in /v1/synthesize requests to engines.
      - ./voices:/data/voices
      # Short-lived OGG/Opus blobs served via /audio/<id>.ogg and fetched by
      # Telegram, browsers, Home Assistant, etc. Swept on a timer.
      - ./audio-cache:/data/audio-cache
      # Consent-check models, downloaded once on first use and kept across rebuilds.
      - ./models:/data/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vox.rule=Host(`vox.delo.sh`)"
      - "traefik.http.routers.vox.entrypoints=websecure"
      - "traefik.http.routers.vox.tls.certresolver=letsencrypt"
      - "traefik.http.services.vox.loadbalancer.server.port=8000"
      - "traefik.docker.network=proxy"
      # FastMCP streaming needs long-lived connections; bump timeouts.
      - "traefik.http.middlewares.vox-sse.headers.customResponseHeaders.Cache-Control=no-cache"
      - "traefik.http.routers.vox.middlewares=vox-sse"

networks:
  proxy:
    external: true
